# H5Z-MANS MPI test config (can be used as the single required input)

# Required for the test
output_h5=/tmp/temp.bin
chunk_mb=8
mode=compress
filter=mans
mans_config_file=/workspace/MANS/tools/H5Z-MANS/config/mans_example.cfg
dataset_config_file=/workspace/MANS/tools/H5Z-MANS/config/synth_example.cfg

# Recommended: use a pre-generated raw file (when set, dataset_config_file is ignored)
# input_bin=/workspace/MANS/build/syn_1024MB.bin

# Optional overrides
ranks=4
metrics_csv=/tmp/h5z_mans_mpi_metrics.csv

# If you want to use dataset_config_file instead, comment out input_bin.
